<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Página de Cadastro e Login</title>
  <link rel="stylesheet" href="assets/css/cad.css" />
  <script src="assets/scripts/cad.js" defer></script>
</head>
<body>
  <!-- Botão para voltar para a página inicial -->
  <button id="btn-voltar" onclick="location.href='index.html'">← Voltar para Home</button>

  <div class="container">
    <div class="form-section login">
      <h2>Login</h2>
      <form>
        <label for="login-email">Email</label>
        <input type="email" id="login-email" name="email" required />
        <label for="login-senha">Senha</label>
        <input type="password" id="login-senha" name="senha" required />
        <button type="submit">Entrar</button>
      </form>
    </div>
    <div class="form-section cadastro">
      <h2>Cadastro</h2>
      <form id="form-cadastro">
        <label for="nome">Nome</label>
        <input type="text" id="nome" name="nome" required />
        <label for="login">Login</label>
        <input type="text" id="login" name="login" required />
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required />
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" required />
        <label for="confirmar-senha">Confirmar Senha</label>
        <input type="password" id="confirmar-senha" name="confirmar_senha" required />
        <button type="submit">Cadastrar</button>
      </form>
    </div>
  </div>

  <div id="mensagem"></div>

  <div class="container" style="flex-direction: column; align-items: center; padding-bottom: 40px;">
    <hr style="width: 80%; border-color: #333;" />
    <h2>Usuários Cadastrados</h2>
    <table id="tabela-usuarios">
      <thead>
        <tr>
          <th>Nome</th>
          <th>Login</th>
          <th>Email</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody>
      </tbody>
    </table>
  </div>

</body>
</html>
